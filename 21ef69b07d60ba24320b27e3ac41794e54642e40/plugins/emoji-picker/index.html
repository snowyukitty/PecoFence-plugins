<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emoji Picker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="bar">
      <div class="search">
        <input id="q" type="text" autocomplete="off" spellcheck="false">
        <button id="clearSearch" class="plain" type="button" hidden>&#x2715;</button>
      </div>
      <input id="size" type="range" min="16" max="72" step="2" value="30">
    </div>
    <div id="cats" class="cats"></div>
    <div id="subbar" class="subbar" hidden>
      <button id="subRecent" class="tab" type="button"></button>
      <button id="subFav" class="tab" type="button"></button>
      <span class="spacer"></span>
      <button id="clearList" class="tab" type="button"></button>
    </div>
    <div id="grid" class="grid"></div>
    <div class="foot">
      <span id="preview" class="preview"></span>
      <span id="name" class="name"></span>
      <button id="fav" class="fav" type="button"></button>
    </div>
  </div>
  <script src="emoji-data.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
